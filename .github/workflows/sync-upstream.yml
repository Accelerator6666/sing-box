name: Sync upstream

on:
  push:
    branches:
      - dev-next
    paths:
      - '.github/workflows/sync-upstream.yml'
  schedule:
    - cron: '45 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: dev-next
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/SagerNet/sing-box.git
          git fetch upstream testing

      - name: Check whether upstream changed
        id: check
        shell: bash
        run: |
          UPSTREAM_SHA="$(git rev-parse upstream/testing)"
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            BASE_SHA="$(git rev-parse HEAD^)"
          else
            BASE_SHA=""
          fi

          echo "upstream_sha=$UPSTREAM_SHA"
          echo "base_sha=$BASE_SHA"

          if [ "$BASE_SHA" = "$UPSTREAM_SHA" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync branch and preserve workflow
        if: steps.check.outputs.changed == 'true'
        shell: bash
        run: |
          cp .github/workflows/sync-upstream.yml /tmp/sync-upstream.yml

          git reset --hard upstream/testing

          mkdir -p .github/workflows
          cp /tmp/sync-upstream.yml .github/workflows/sync-upstream.yml

          git add .github/workflows/sync-upstream.yml
          git commit -m "ci: preserve automatic upstream sync"

          git push origin HEAD:dev-next --force-with-lease
