name: Sync upstream

on:
  push:
    branches:
      - dev-next
    paths:
      - '.github/workflows/sync-upstream.yml'
  schedule:
    - cron: '45 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: dev-next
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/SagerNet/sing-box.git
          git fetch upstream testing

      - name: Check whether upstream content changed
        id: check
        shell: bash
        run: |
          if git diff --quiet HEAD upstream/testing -- . ':(exclude).github/workflows'; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync content and preserve workflows
        if: steps.check.outputs.changed == 'true'
        shell: bash
        run: |
          rm -rf /tmp/fork-workflows
          mkdir -p /tmp/fork-workflows
          if [ -d .github/workflows ]; then
            cp -a .github/workflows/. /tmp/fork-workflows/
          fi

          git rm -r --ignore-unmatch .
          git checkout upstream/testing -- .

          rm -rf .github/workflows
          mkdir -p .github/workflows
          cp -a /tmp/fork-workflows/. .github/workflows/

          git add -A

          if git diff --cached --quiet; then
            echo "No content changes to commit."
            exit 0
          fi

          git commit -m "sync: align with SagerNet/sing-box:testing"
          git push origin HEAD:dev-next
